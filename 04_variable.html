<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Variables in JavaScript</title>
    <script>
        console.log("Hello, I am a variable");
        let a = "Aditya Dhattwalia";
        console.log(a);
        let b=100;
        b=99;
        console.log(b);
        let c=500;
        console.log(c);
        c="Kunal Chauhan";
        console.log(c);
        const d="hehe";
        console.log(d);
        //d= bawa;
        //console.log(d); shows ERROR because we cannot change the value of a constant variable
        console.log("This data type is " + typeof "Hello");
        console.log("This data type is " + typeof 1234);
        console.log("This data type is " + typeof true);
        console.log("This data type is " + typeof undefined);
        console.log("This data type is " + typeof null);
        console.log("This data type is " + typeof 123456789876543211);
        console.log("This data type is " + typeof {});
        console.log("This data type is actually an array " + typeof []);
        console.log("This data type is " + typeof function(){});
        
    </script>
</head>
<body>
    <h2>Learning Variables in JavaScript</h2>
</body>
</html>
