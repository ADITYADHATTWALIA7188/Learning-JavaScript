<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operators</title>
    <script>
        let a = 20;
        let b = 10;
         console.log("a + b =", a +b);
         console.log("a - b =",a-b);
         console.log("a x b =",a*b);
         console.log("a/b =",a/b);
         console.log("a ^ b =", a**b);
         console.log("a % b =", a % b );
            a++;
            console.log("a++ =", a);
             b--;
             console.log("b-- =", b);
    </script>
</head>
<body>
    <h2>Learning Operators</h2>
    <p>Operators are symbols that perform operations on variables and values.<br> In JavaScript, there are several types of operators:</p>
    <ol>
        <li>Arithmetic Operators</li>
        <li>Comparison Operators</li>
        <li>Logical Operators</li>
        <li>Assignment Operators</li>
        <li>Ternary Operator</li>
    </ol>
</body>
</html>
