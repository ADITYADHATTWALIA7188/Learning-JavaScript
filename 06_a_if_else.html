<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>If-Else</title>
    <script>
        console.log("Learning If else program");
        let marks = 45;
        if(marks >=90 ){
            console.log("Grade=A");
        } else if(marks >=80 ){
            console.log("Grade=B");
        } else if (marks >=70 ){
            console.log("Grade=C");
        } else if ( marks >= 60){
            console.log("Grade=D");
        }
        else {
            console.log("Sorry You Can't make it this time");
        }
    </script>
</head>
